<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Помощник по вопросам</title>
<style>
:root{--bg:#f6f4fb;--sf:#fff;--tx:#1d1b20;--mu:#6b6775;--ac:#5b3fd1;--ac2:#e9e2ff;--ok:#1b7f4b;--er:#b3261e;--bd:#e3dff0;--fs:16px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:0.875rem;min-height:1.5rem}.kv span{color:var(--mu)}
.hist{padding:8px;max-height:7rem;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px}.hist .chip{min-height:2rem;font-size:0.8125rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.in{width:100%;min-height:3rem;border-radius:14px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 12px;font:inherit;margin:8px 0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:1rem/1.45 var(--ff,system-ui,sans-serif);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;scroll-behavior:smooth}
nav{display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:3.5rem;border:0;background:none;color:var(--mu);font:inherit;font-size:0.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--ac);font-weight:700}
svg{width:1.375rem;height:1.375rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--sf);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002;transition:.2s}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:3rem;padding:.4em 1em;border:0;border-radius:1.5rem;background:var(--ac);color:var(--on);font:inherit;font-weight:600}
.btn.s{background:var(--ac2);color:var(--ac)}
.ib{width:3rem;height:3rem;border:0;border-radius:24px;background:var(--ac2);color:var(--ac);display:grid;place-items:center}
.ib.on{background:var(--ac);color:var(--on)}
input[type=search],select{width:100%;min-height:3.25rem;border-radius:26px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 18px;font:inherit}
input[type=search]:focus{outline:0;border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{flex:none;min-height:2.5rem;padding:0 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-size:0.875rem}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.q{font-weight:600}.a{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--ac2);color:var(--ac);font-size:1.12em;font-weight:600;white-space:pre-wrap}
.a ul{margin:0;padding-left:20px}.lb{font-size:0.75rem;color:var(--mu);margin-top:8px}
.bd{display:inline-block;font-size:0.75rem;background:var(--ac2);color:var(--ac);border-radius:10px;padding:2px 10px;margin-bottom:6px}
.mu{color:var(--mu);font-size:0.875rem}.er{color:var(--er)}
.bar{height:0.625rem;border-radius:5px;background:var(--ac2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:.2s}
.sk{height:5.625rem;border-radius:20px;background:linear-gradient(90deg,var(--sf),var(--ac2),var(--sf));background-size:200%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200%}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:#322f37;color:#fff;border-radius:14px;padding:12px 16px;opacity:0;pointer-events:none;transition:.2s;text-align:center}
#toast.on{opacity:1}
.sw{display:flex;border-radius:24px;background:var(--ac2);padding:3px}.sw button{flex:1;min-height:2.625rem;border:0;border-radius:21px;background:none;color:var(--ac);font:inherit}.sw .on{background:var(--ac);color:#fff}
label.r{display:flex;justify-content:space-between;align-items:center;min-height:3rem}
option{background:var(--sf);color:var(--tx)}
input[type=checkbox]{accent-color:var(--ac)}
mark{color:inherit;border-radius:4px;padding:0 2px;transition:background .2s}
.m1{background:var(--m1)}.m2{background:var(--m2)}.m3{background:#d9ef9c;background:color-mix(in srgb,var(--m1) 50%,var(--m2) 50%)}
.div{height:1px;background:var(--bd);margin:12px 0}
.bd{margin-right:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.view>.card{animation:up .32s cubic-bezier(.2,.8,.2,1) both}
.view>.card:nth-child(2){animation-delay:.05s}.view>.card:nth-child(3){animation-delay:.1s}.view>.card:nth-child(4){animation-delay:.15s}
.rc{animation:fi .18s ease both}
.btn,.ib,.chip,nav button{transition:transform .12s,background .2s,color .2s,opacity .2s}
.btn:active,.ib:active,.chip:active{transform:scale(.95)}
nav button.on svg{animation:pop .3s}
#toast{transform:translateY(12px);transition:.25s}#toast.on{transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sh{position:fixed;inset:0;z-index:20;pointer-events:none}
.shb{position:absolute;inset:0;background:#0007;opacity:0;transition:opacity .25s}
.shp{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow-y:auto;box-shadow:0 -4px 20px #0004}
.sh.on{pointer-events:auto}.sh.on .shb{opacity:1}.sh.on .shp{transform:none}
.shp h3{margin:0 0 12px}
.pick{width:100%;min-height:3.25rem;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;color:var(--tx);font:inherit;padding:0 2px}
.pick b{color:var(--ac);font-weight:600;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--tx);font:inherit;font-size:0.8125rem;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .12s}
.tile:active{transform:scale(.95)}.tile.on{outline:3px solid var(--ac)}
.pv{width:100%;height:3.375rem;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700}
.pv i{width:0.875rem;height:0.875rem;border-radius:7px}
.opt{width:100%;display:flex;flex-direction:column;align-items:flex-start;border:0;border-radius:14px;background:none;color:var(--tx);font:inherit;padding:10px 12px;margin-bottom:4px;min-height:3.25rem;text-align:left}
.opt small{color:var(--mu)}.opt.on{background:var(--ac2);color:var(--ac)}
.tg2{font-size:0.75rem;padding:2px 8px;border-radius:10px;margin-left:8px;font-weight:600}
.okc{background:var(--m2);color:var(--tx)}.old{background:#f5c6c2;color:#601410}
.g .btn{padding:6px 10px;font-size:0.875rem;line-height:1.2}
.tp{background:var(--ac2);color:var(--ac)}
.tx{flex:1;padding-right:12px}.tx b{display:block}.sub{display:block;font-size:.82rem;line-height:1.3;color:var(--mu);font-weight:400;margin-top:2px}
label.r{gap:8px;padding:4px 0}
</style></head><body>
<main id="m"></main>
<div id="toast"></div>
<nav id="nav"></nav>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="sh" class="sh"><div class="shb" data-close="1"></div><div class="shp" id="shp"></div></div>
<script>
'use strict';
/* ═══ storage: IndexedDB (key-value) ═══ */
const DB=new Promise((ok,no)=>{const q=indexedDB.open('qa-helper',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=no});
const kvGet=async k=>{const d=await DB;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})};
const kvSet=async(k,v)=>{const d=await DB;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})};
const kvDel=async k=>{const d=await DB;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=r})};

/* ═══ network ═══ */
const SITE='https://sdo-otvety.info',JSON_URL=SITE+'/assets/questions.json';
async function fetchText(url){ // нативный HTTP в Capacitor, иначе fetch
  const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
  if(H){const r=await H.get({url,connectTimeout:20000,readTimeout:60000,responseType:'text'});if(r.status>=400)throw Error('HTTP '+r.status);return typeof r.data==='string'?r.data:JSON.stringify(r.data)}
  const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}
}
async function fetchJsonProgress(url,cb){ // потоковое чтение, если возможно
  if(!(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp)){
    const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);
    const tot=+r.headers.get('content-length')||0;
    if(r.body&&r.body.getReader){const rd=r.body.getReader(),ch=[];let n=0,t0=Date.now();
      for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);n+=value.length;cb(n,tot,n/Math.max(.1,(Date.now()-t0)/1000))}
      return new TextDecoder().decode(await new Blob(ch).arrayBuffer())}
    return r.text()}
  cb(0,0,0);const t=await fetchText(url);cb(t.length,t.length,0);return t;
}

/* ═══ search-index ═══ */
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim();
function validate(arr){
  if(!Array.isArray(arr))throw Error('Ожидался массив объектов [{q,a,c,u}]');
  const seen=new Set(),out=[];let bad=0;
  for(const o of arr){if(!o||typeof o.q!=='string'||typeof o.a!=='string'||!o.q.trim()){bad++;continue}
    const k=o.q+'\u0001'+o.a;if(seen.has(k))continue;seen.add(k);
    out.push({q:o.q.trim(),a:o.a.trim(),c:String(o.c||'Без категории'),u:typeof o.u==='string'?o.u:''})}
  if(!out.length)throw Error('В файле нет корректных записей (нужны поля q и a)');
  return{out,bad};
}
function build(items){
  const m=new Map(),cats={};
  items.forEach((it,i)=>{it.nq=norm(it.q);it.na=norm(it.a);cats[it.c]=(cats[it.c]||0)+1;
    new Set((it.nq+' '+it.na).split(' ')).forEach(t=>{if(!t)return;const a=m.get(t);a?a.push(i):m.set(t,[i])})});
  S.idx={m,keys:[...m.keys()].sort()};S.cats=cats;
}
const lb=(k,t)=>{let l=0,h=k.length;while(l<h){const x=(l+h)>>1;k[x]<t?l=x+1:h=x}return l};
function search(){
  const q=norm(S.q);S.res=[];if(!q||!S.idx)return;
  const ts=q.split(' '),{m,keys}=S.idx;let ids=null;
  for(const t of ts){const set=new Set();for(let i=lb(keys,t);i<keys.length&&keys[i].startsWith(t);i++)for(const id of m.get(keys[i]))set.add(id);
    ids=ids?new Set([...ids].filter(x=>set.has(x))):set;if(!ids.size)break}
  const r=[];
  for(const id of ids){const it=S.items[id];if(S.cat&&it.c!==S.cat)continue;let s=0,pos=-1,ord=true;
    for(const t of ts){let p=it.nq.startsWith(t)?0:it.nq.indexOf(' '+t);
      if(p>=0){s+=10+t.length;if(p===0)s+=5;if(p<pos)ord=false;pos=p}else s+=3}
    if(ord&&ts.length>1)s+=5;if(it.nq.includes(q))s+=20;if(it.nq.startsWith(q))s+=10;r.push([id,s])}
  r.sort((a,b)=>b[1]-a[1]);S.res=r.map(x=>x[0]);
}

/* ═══ state ═══ */
const THEMES={auto:'Системная',light:'Светлая',dark:'Тёмная',blue:'Голубая',sepia:'Сепия',gray:'Серая'};
/* палитры: bg,sf,tx,mu,ac,ac2,bd,on,m1(совпадение),m2(уникальное); последний флаг — тёмная */
const TH={light:['#f6f4fb,#ffffff,#1d1b20,#6b6775,#5b3fd1,#e9e2ff,#e3dff0,#ffffff,#fff3a6,#c6efbd',0],
dark:['#141218,#1f1b26,#ece6f2,#a9a3b5,#b9a6ff,#352c58,#332e3d,#1d1b20,#6a5f1c,#25572e',1],
blue:['#eaf2fb,#ffffff,#12263f,#566b85,#1565c0,#d9e8fa,#c9dbf0,#ffffff,#fff1a0,#bfeac4',0],
sepia:['#f4ecd8,#fbf5e6,#3b2f1e,#7a6a52,#9a5b1f,#efe0c2,#e0d2b4,#ffffff,#f6e08a,#cfe4a8',0],
gray:['#dcdee1,#eceef0,#1c1e21,#555a60,#3d4b5c,#cdd2d8,#bcc2c9,#ffffff,#f3e58f,#bfe0b8',0]};
const FONTS={sys:['Системный','system-ui,sans-serif'],serif:['С засечками','Georgia,"Times New Roman",serif'],mono:['Моноширинный','ui-monospace,Menlo,Consolas,monospace'],round:['Округлый','"Trebuchet MS","Segoe UI",sans-serif']};
const S={tab:'s',mode:'site',remote:'',retry:'inst',items:[],idx:null,cats:{},cat:'',q:'',lim:10,res:[],hist:[],pref:{theme:'auto',font:'sys',fs:16,auto:true,hm:true,hu:true,n:10},meta:{},st:null,pend:null};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vib=()=>navigator.vibrate&&navigator.vibrate(15);
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
const RW=/[A-Za-zА-Яа-яЁё0-9]+/g;
const I={t:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>',s:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
 g:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};

/* ═══ data ═══ */
const MODES={site:'Сайт',site2:'Сайт 2.0'};
const dbK=()=>S.mode==='site'?'db':'db_s2',metaK=()=>S.mode==='site'?'meta2':'meta_s2';
async function loadActive(){S.items=(await kvGet(dbK()))||[];S.q='';S.cat='';S.lim=S.pref.n;build(S.items);search()}
/* дата актуальности на сайте */
async function remoteDate(){
  const html=await fetchText(SITE+'/'),mt=/Материал обновл[её]н\s+(\d{2}\.\d{2}\.\d{4})/.exec(html);
  if(!mt)throw Error('Не удалось найти дату на странице');return mt[1];
}
const dnum=d=>{const [a,b,c]=d.split('.');return +c*10000+ +b*100+ +a};
/* только узнаём дату на сайте, ничего не устанавливаем. silent — без сообщений (автопроверка) */
async function checkRemote(silent){
  if(!silent){S.st={t:'msg',m:'Проверяю сайт…'};S.retry='chk';render()}
  try{
    const d=await remoteDate();S.remote=d;const cur=S.meta.date;
    if(!silent)S.st={t:'msg',m:'Дата материала на сайте: '+d+(!S.items.length||!cur?'':dnum(cur)>=dnum(d)?'. У вас актуальная база':'. Ваш материал устарел')};
  }catch(e){if(!silent)S.st={t:'err',m:(navigator.onLine?'Ошибка: ':'Нет сети. ')+e.message}}
  silent?refreshHead():render();
}
/* установка актуальной БД с сайта; старая заменяется только после проверки новой */
async function installRemote(){
  S.retry='inst';S.st={t:'prog',p:0,m:'Подключаюсь…'};render();
  try{
    const d=await remoteDate();S.remote=d;S.st={t:'prog',p:0,m:'Загрузка базы…'};render();
    const text=await fetchJsonProgress(JSON_URL,(n,tot,sp)=>{S.st={t:'prog',p:tot?n/tot*100:0,m:'Загрузка: '+(n/1048576).toFixed(1)+(tot?' / '+(tot/1048576).toFixed(1):'')+' МБ'+(sp?', '+(sp/1048576).toFixed(2)+' МБ/с':'')};upBar()});
    S.st={t:'msg',m:'Обработка и индексация…'};render();await new Promise(r=>setTimeout(r,30));
    let arr;try{arr=JSON.parse(text)}catch(e){throw Error('Файл повреждён: это не корректный JSON')}
    const{out}=validate(arr);await kvSet(dbK(),out);
    S.meta={type:'site',date:d,count:out.length};await kvSet(metaK(),S.meta);await loadActive();
    S.st={t:'msg',m:'Установлено: '+out.length+' вопросов, материал от '+d};vib();
  }catch(e){S.st={t:'err',m:(navigator.onLine?'Ошибка: ':'Нет сети. ')+e.message}}
  render();
}
function upBar(){const b=$('#bar');if(b)b.style.width=S.st.p+'%';const l=$('#bl');if(l)l.textContent=S.st.m+(S.st.p?' ('+Math.round(S.st.p)+'%)':'')}
/* сохранение текущей базы в Download: «questions_<дата>.json» */
async function dl(){
  if(!S.items.length)return toast('База пуста');
  const name='questions_'+(S.meta.date||'без_даты')+'.json',data=JSON.stringify(S.items.map(({q,a,c,u})=>({q,a,c,u})));
  const FS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem;
  if(FS){try{await FS.requestPermissions().catch(()=>{});
    await FS.writeFile({path:'Download/'+name,data,directory:'EXTERNAL_STORAGE',encoding:'utf8',recursive:true});
    return toast('Сохранено: Download/'+name)}catch(e){console.warn(e)}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();
}
/* ═══ ui ═══ */
/* слова запроса (нормализованные) */
const qToks=()=>norm(S.q).split(' ').filter(Boolean);
/* Подсветка: совпадения (жёлтый), уникальные (салатовый), оба сразу (смесь). uq — Set индексов слов */
function hlText(text,uq){
  const ts=qToks();let out='',last=0,i=0;
  for(const m of text.matchAll(RW)){
    out+=esc(text.slice(last,m.index));
    const w=norm(m[0]),a=S.pref.hm&&ts.some(t=>w.startsWith(t)),u=!!(uq&&uq.has(i));
    out+=(a||u)?`<mark class="${u?'m2':'m1'}">${esc(m[0])}</mark>`:esc(m[0]);
    last=m.index+m[0].length;i++;
  }
  return out+esc(text.slice(last));
}
/* Уникальные слова/словосочетания среди показанных вопросов: то, чего нет в других вопросах выдачи */
const STOP=new Set('для при над под про без что как это или его все она они был были быть может которые который какой какие'.split(' '));
function uniqueMap(ids){
  const info=ids.map(id=>({id,toks:[...S.items[id].q.matchAll(RW)].map(m=>norm(m[0]))}));
  const df=new Map(); // в скольких показанных вопросах встречается слово
  info.forEach(o=>new Set(o.toks).forEach(t=>df.set(t,(df.get(t)||0)+1)));
  const res=new Map();
  info.forEach(o=>{
    const sel=new Set();
    // при единственном вопросе сравнивать не с чем — подсвечиваем только метку «Уникален»
    if(ids.length>1)o.toks.forEach((t,i)=>{if(t.length>2&&!STOP.has(t)&&df.get(t)===1)sel.add(i)});
    res.set(o.id,{sel,uniq:ids.length===1||sel.size>0});
  });
  return res;
}
function ans(a){
  const parts=a.split(/\n|\s\|\s|;\s/).map(x=>x.trim()).filter(Boolean);
  return parts.length>1?'<ul>'+parts.map(p=>'<li>'+hlText(p)+'</li>').join('')+'</ul>':hlText(a);
}
function cardHtml(id,um){
  const it=S.items[id],u=um&&um.get(id);
  return `<div class="card rc"><span class="bd">${esc(it.c)}</span>
  <div class="lb">Вопрос</div><div class="q">${hlText(it.q,u&&u.sel)}</div><div class="lb">Ответ</div><div class="a">${ans(it.a)}</div></div>`;
}
function stat(){const st=S.st;if(!st)return '';
  return st.t==='prog'?`<div class="bar"><i id="bar" style="width:${st.p}%"></i></div><div id="bl" class="mu">${st.m}</div>`:
  `<div class="${st.t==='err'?'er':'mu'}" style="margin:6px 0">${esc(st.m)}</div>${st.t==='err'?`<button class="btn" data-act="${S.retry}">Повторить</button>`:''}`}
/* Материал: актуальна / устарел (сравнение с датой на сайте) */
function badge(){
  if(!S.remote||!S.meta.date||!S.items.length)return '';
  return dnum(S.meta.date)>=dnum(S.remote)?'<span class="tg2 okc">Актуальна</span>':`<span class="tg2 old">Устарел: ${S.remote}</span>`;
}
const typeName=()=>S.meta.type==='own'?'Своя':S.meta.type==='site'?'Сайт':'—';
const infoRows=()=>`<div class="kv"><span>Режим работы:</span><b>${MODES[S.mode]}${S.meta.type?`<span class="tg2 tp">БД ${typeName()}</span>`:''}</b></div><div class="kv"><span>Материал от:</span><b>${S.meta.date||'—'}${badge()}</b></div><div class="kv"><span>Вопросов:</span><b>${S.items.length}</b></div>`;
const head=()=>`<div class="card" id="hd" style="padding:12px 14px">${infoRows()}<div class="kv"><span>Раздел:</span><b>${esc(S.cat||'Все')}</b></div></div>`;
const refreshHead=()=>{const e=$('#hd');if(e)e.outerHTML=head()};
const histHtml=()=>S.hist.length?S.hist.map(h=>`<button class="chip" data-h="${esc(h)}">${esc(h)}</button>`).join(''):'<span class="mu">История поиска пуста</span>';
function resHtml(){
  if(!norm(S.q))return '<div class="mu" style="text-align:center;margin-top:24px">Введите слова или части слов в любом порядке</div>';
  if(!S.res.length)return '<div class="card" style="text-align:center"><b>Ничего не найдено</b><div class="mu">Проверьте ввод или смените раздел в настройках</div></div>';
  const ids=S.res.slice(0,S.lim),um=S.pref.hu?uniqueMap(ids):null;
  return `<div class="mu" style="margin:4px 4px 8px">Найдено: ${S.res.length}</div>`+ids.map(id=>cardHtml(id,um)).join('')+(S.res.length>S.lim?'<button class="btn s" data-act="more" style="width:100%">Показать ещё</button>':'');
}
function viewSearch(){
  if(S.loading)return '<div class="sk"></div><div class="sk"></div>';
  if(!S.items.length)return head()+stat()+`<div class="card" style="text-align:center"><b>Базы нет</b><div class="mu" style="margin:6px 0 12px">Установите актуальную базу с сайта (интернет нужен один раз) или выгрузите свой JSON-файл в настройках.</div><div class="row" style="justify-content:center"><button class="btn" data-act="inst">Установить актуальную БД</button><button class="btn s" data-tab="g">Настройки</button></div></div>`;
  return head()+stat()+`<div class="card hist" id="hist">${histHtml()}</div>
  <input type="search" id="q" placeholder="Поиск: например «боков ролик 500»" value="${esc(S.q)}" aria-label="Поиск" autocomplete="off">
  <div id="res" style="margin-top:12px">${resHtml()}</div>`;
}
const opts=(o,v)=>Object.entries(o).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${Array.isArray(n)?n[0]:n}</option>`).join('');
function viewSet(){
  const chk=(id,on)=>`<input type="checkbox" id="${id}" ${on?'checked':''} style="width:1.5rem;height:1.5rem;flex:none">`;
  const p=S.pend?`<div style="margin-top:12px"><div class="mu">Файл проверен: ${S.pend.out.length} записей${S.pend.bad?', пропущено битых: '+S.pend.bad:''}. Укажите дату актуальности материала (ДД.ММ.ГГГГ):</div>
   <input type="text" id="pd" class="in" inputmode="numeric" placeholder="01.01.2000" maxlength="10"><div class="row"><button class="btn" data-act="psave">Сохранить</button><button class="btn s" data-act="pcancel">Отмена</button></div></div>`:'';
  return `<div class="card"><b>Режим работы</b><div class="g" style="margin-top:10px">${Object.entries(MODES).map(([k,n])=>`<button class="chip ${S.mode===k?'on':''}" data-mode="${k}">${n}</button>`).join('')}</div></div>
  <div class="card">
  <div class="row" style="justify-content:space-between"><b>База данных</b><button class="ib" data-act="clr" aria-label="Очистить базу">${I.t}</button></div>
  <div style="margin-top:8px">${infoRows()}</div>${stat()}
  <div class="g" style="margin-top:10px"><button class="btn s" data-act="chk">Проверить актуальность</button><button class="btn s" data-act="inst">Установить актуальную БД</button><button class="btn s" data-act="load">Выгрузить БД</button><button class="btn s" data-act="exp">Скачать БД</button></div>${p}
  <div class="div"></div>
  ${row("cat","Раздел",S.cat||"Все")}
  <label class="r">Автопроверка при запуске${chk('au',S.pref.auto)}</label>
  <button class="btn s" data-act="clh">Очистить историю поиска</button></div>
  <div class="card"><b>Системные</b>
  ${row("theme","Тема",THEMES[S.pref.theme])}
  ${row("font","Шрифт",FONTS[S.pref.font][0])}
  <label class="r">Размер текста: <span id="fsl">${S.pref.fs} px</span><input type="range" id="fs" min="14" max="26" value="${S.pref.fs}" style="width:50%"></label>
  <label class="r">Найденных вопросов: <span id="nl">${S.pref.n}</span><input type="range" id="nn" min="1" max="20" value="${S.pref.n}" style="width:50%"></label>
  <div class="div"></div>
  <label class="r"><span class="tx"><b>Подсветка желтым</b><span class="sub">Слова совпавшие с теми что вы ввели в поиск подсвечены желтым</span></span>${chk('hm',S.pref.hm)}</label>
  <label class="r"><span class="tx"><b>Подсветка зеленым</b><span class="sub">Слова являющиеся уникальными для вопроса подсвечены зеленым</span></span>${chk('hu',S.pref.hu)}</label></div>`;
}
function render(){
  const v=S.tab==='s'?viewSearch():viewSet(),an=S.lastTab!==S.tab;S.lastTab=S.tab;
  $('#m').innerHTML=`<div class="${an?'view':''}">${v}</div>`;
  $('#nav').innerHTML=[['s','Поиск'],['g','Настройки']].map(([k,n])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}" aria-label="${n}">${I[k]}${n}</button>`).join('');
}
function applyPref(){
  const r=document.documentElement;let id=S.pref.theme;
  if(id==='auto')id=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  if(!TH[id])id='light';
  const v=TH[id][0].split(',');
  ['bg','sf','tx','mu','ac','ac2','bd','on','m1','m2'].forEach((k,i)=>r.style.setProperty('--'+k,v[i]));
  r.style.colorScheme=TH[id][1]?'dark':'light';
  r.style.fontSize=S.pref.fs+'px';r.style.setProperty('--ff',(FONTS[S.pref.font]||FONTS.sys)[1]);
}
const savePref=()=>kvSet('pref',S.pref);
const row=(k,l,v)=>`<button class="pick" data-act="pk" data-k="${k}"><span>${l}</span><b>${esc(String(v))} ›</b></button>`;
function sheet(html){$('#shp').innerHTML=html;$('#sh').classList.add('on')}
function closeSheet(){$('#sh').classList.remove('on')}
function openPick(k){
  if(k==='theme')return sheet('<h3>Тема</h3><div class="tg">'+Object.keys(THEMES).map(id=>{
    const c=(id==='auto'?TH.light:TH[id])[0].split(','),bg=id==='auto'?`linear-gradient(135deg,${c[0]} 50%,${TH.dark[0].split(',')[0]} 50%)`:c[0];
    return `<button class="tile ${S.pref.theme===id?'on':''}" data-pv="theme|${id}"><span class="pv" style="background:${bg};color:${id==='auto'?'#888':c[2]}">Аа<i style="background:${c[4]}"></i></span>${THEMES[id]}</button>`}).join('')+'</div>');
  if(k==='font')return sheet('<h3>Шрифт</h3>'+Object.entries(FONTS).map(([id,[n,f]])=>`<button class="opt ${S.pref.font===id?'on':''}" data-pv="font|${id}" style="font-family:${f}"><span>${n}</span><small>Образец текста: Аа Бб 0123</small></button>`).join(''));
  if(k==='cat'){const cs=Object.entries(S.cats).sort((a,b)=>b[1]-a[1]);
    return sheet('<h3>Раздел поиска</h3>'+[['',`Все (${S.items.length})`],...cs.map(([c,n])=>[c,`${c} (${n})`])].map(([c,n])=>`<button class="opt ${S.cat===c?'on':''}" data-pv="cat|${esc(c)}">${esc(n)}</button>`).join(''))}
}
function go(t,push){S.tab=t;if(push!==false)history.pushState({t},'');render()}

/* ═══ events ═══ */
let dt;
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='pd'){const d=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=d.slice(0,2)+(d.length>2?'.':'')+d.slice(2,4)+(d.length>4?'.':'')+d.slice(4)}
  if(id==='q'){S.q=e.target.value;S.lim=S.pref.n;clearTimeout(dt);dt=setTimeout(()=>{search();$('#res').innerHTML=resHtml();
    clearTimeout(S.ht);S.ht=setTimeout(()=>{const n=norm(S.q);if(n.length>2&&S.res.length){S.hist=[n,...S.hist.filter(x=>x!==n)].slice(0,15);kvSet('hist',S.hist);const h=$('#hist');if(h)h.innerHTML=histHtml()}},1500)},30)}
  if(id==='ct'){S.cat=e.target.value;S.lim=S.pref.n;search();toast('Раздел: '+(S.cat||'Все'))}
  if(id==='th'){S.pref.theme=e.target.value;applyPref();savePref()}
  if(id==='ft'){S.pref.font=e.target.value;applyPref();savePref()}
  if(id==='fs'){S.pref.fs=+e.target.value;$('#fsl').textContent=S.pref.fs+' px';applyPref();savePref()}
  if(id==='nn'){S.pref.n=+e.target.value;S.lim=S.pref.n;$('#nl').textContent=S.pref.n;savePref()}
  if(id==='hm'||id==='hu'){S.pref[id]=e.target.checked;savePref();if(S.q)search()}
  if(id==='au'){S.pref.auto=e.target.checked;savePref()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act],[data-tab],[data-h],[data-mode],[data-pv],[data-close]');if(!b)return;
  const d=b.dataset;
  if(d.tab)return go(d.tab);
  if(d.h){S.q=d.h;render();search();$('#res').innerHTML=resHtml();return}
  if(d.mode){S.mode=d.mode;S.st=null;S.pend=null;await kvSet('mode2',S.mode);S.meta=(await kvGet(metaK()))||{};await loadActive();vib();return render()}
  if(d.close){closeSheet();return}
  if(d.pv){const i=d.pv.indexOf('|'),k=d.pv.slice(0,i),v=d.pv.slice(i+1);
    if(k==='theme'){S.pref.theme=v;applyPref();savePref()}
    if(k==='font'){S.pref.font=v;applyPref();savePref()}
    if(k==='cat'){S.cat=v;S.lim=S.pref.n;search()}
    vib();closeSheet();render();return}
  switch(d.act){
    case'chk':checkRemote();break;
    case'inst':
      if(S.meta.type==='own'&&S.items.length){sheet(`<h3>Заменить свою базу?</h3><p class="mu">Ваша база (${S.items.length} вопросов) будет заменена актуальной с сайта. Скачайте её заранее, если она нужна.</p><div class="row"><button class="btn s" data-close="1" style="flex:1">Отмена</button><button class="btn" data-act="instok" style="flex:1">Заменить</button></div>`);break}
    case'instok':closeSheet();installRemote();break;
    case'more':S.lim+=S.pref.n;$('#res').innerHTML=resHtml();break;
    case'exp':dl();break;
    case'load':$('#file').click();break;
    case'pcancel':S.pend=null;render();break;
    case'psave':{const dt=$('#pd').value.trim(),m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(dt);
      if(!m||+m[1]<1||+m[1]>31||+m[2]<1||+m[2]>12)return toast('Введите дату в формате ДД.ММ.ГГГГ, например 01.01.2000');
      await kvSet(dbK(),S.pend.out);S.meta={type:'own',date:dt,count:S.pend.out.length};await kvSet(metaK(),S.meta);
      S.pend=null;S.st=null;await loadActive();toast('База сохранена');vib();render();break}
    case'pk':openPick(d.k);break;
    case'clr':{
      if(!S.items.length){toast('База уже пуста');break}
      sheet(`<h3>Очистить базу?</h3><p class="mu">База «${typeName()}» (${S.items.length} вопросов) будет удалена с телефона. Действие нельзя отменить.</p>
      <div class="row"><button class="btn s" data-close="1" style="flex:1">Отмена</button><button class="btn" data-act="clrok" style="flex:1;background:#b3261e;color:#fff">Удалить</button></div>`);break}
    case'clh':S.hist=[];kvSet('hist',[]);toast('История очищена');break;
    case'clrok':closeSheet();await kvDel(dbK());S.meta={};await kvSet(metaK(),{});S.st=null;S.pend=null;await loadActive();toast('База очищена');vib();render();break
  }
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{let arr;try{arr=JSON.parse(await f.text())}catch{throw Error('Файл повреждён: это не корректный JSON')}
    S.pend=validate(arr);render()}
  catch(err){toast('Ошибка: '+err.message)}
});
window.addEventListener('popstate',()=>{if($('#sh').classList.contains('on')){closeSheet();return}if(S.tab!=='s')go('s',false)});

/* ═══ старт ═══ */
(async()=>{
  S.loading=true;render();
  try{
    S.mode=(await kvGet('mode2'))||'site';if(!MODES[S.mode])S.mode='site';
    S.meta=(await kvGet(metaK()))||{};
    if(S.mode==='site'&&!(await kvGet(dbK()))){ // перенос из старой версии (две отдельные базы)
      const om=(await kvGet('meta'))||{},m0=await kvGet('mode')==='own'?'own':'site';
      for(const t of [m0,m0==='own'?'site':'own']){const d=await kvGet('db_'+t);
        if(d&&d.length){await kvSet(dbK(),d);S.meta={type:t,date:(om[t]||(t==='site'?om:{})).date||'',count:d.length};await kvSet(metaK(),S.meta);break}}
    }
    S.hist=(await kvGet('hist'))||[];Object.assign(S.pref,await kvGet('pref')||{});
    if(!THEMES[S.pref.theme])S.pref.theme='auto';
    applyPref();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyPref);S.lim=S.pref.n;await loadActive();
  }catch(e){toast('Ошибка хранилища: '+e.message)}
  S.loading=false;render();
  if(S.pref.auto&&navigator.onLine)checkRemote(true);
})();
</script></body></html>
