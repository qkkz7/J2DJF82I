<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Helper 1.1</title>
<style>
:root{--bg:#f6f4fb;--sf:#fff;--tx:#1d1b20;--mu:#6b6775;--ac:#5b3fd1;--ac2:#e9e2ff;--ok:#1b7f4b;--er:#b3261e;--bd:#e3dff0;--fs:16px}
:root[data-t=dark],:root[data-t=amoled]{--bg:#141218;--sf:#1f1b26;--tx:#ece6f2;--mu:#a9a3b5;--ac:#b9a6ff;--ac2:#352c58;--ok:#6fdc9c;--er:#ffb4ab;--bd:#332e3d}
:root[data-t=amoled]{--bg:#000;--sf:#0d0d0d;--ac:#8ab4ff;--ac2:#1a2640;--bd:#222}
:root[data-t=sepia]{--bg:#f4ecd8;--sf:#fbf5e6;--tx:#3b2f1e;--mu:#7a6a52;--ac:#9a5b1f;--ac2:#efe0c2;--bd:#e0d2b4}
:root[data-t=blue]{--bg:#eaf2fb;--sf:#fff;--tx:#12263f;--mu:#566b85;--ac:#1565c0;--ac2:#d9e8fa;--bd:#c9dbf0}
@media(prefers-color-scheme:dark){:root[data-t=auto]{--bg:#141218;--sf:#1f1b26;--tx:#ece6f2;--mu:#a9a3b5;--ac:#b9a6ff;--ac2:#352c58;--ok:#6fdc9c;--er:#ffb4ab;--bd:#332e3d}}
:root[data-t=dark] .btn,:root[data-t=amoled] .btn{color:#1d1b20}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;min-height:24px}.kv span{color:var(--mu)}
.hist{padding:8px;max-height:64px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px}.hist .chip{min-height:32px;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.in{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 12px;font:inherit;margin:8px 0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.45 var(--ff,system-ui,sans-serif);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;scroll-behavior:smooth}
nav{display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--ac);font-weight:700}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--sf);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002;transition:.2s}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:48px;padding:0 16px;border:0;border-radius:24px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
:root[data-t=dark] .btn{color:#1d1b20}
.btn.s{background:var(--ac2);color:var(--ac)}
.ib{width:48px;height:48px;border:0;border-radius:24px;background:var(--ac2);color:var(--ac);display:grid;place-items:center}
.ib.on{background:var(--ac);color:#fff}
input[type=search],select{width:100%;min-height:52px;border-radius:26px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 18px;font:inherit}
input[type=search]:focus{outline:0;border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.q{font-weight:600}.a{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--ac2);color:var(--ac);font-size:1.12em;font-weight:600;white-space:pre-wrap}
.a ul{margin:0;padding-left:20px}.lb{font-size:12px;color:var(--mu);margin-top:8px}
.bd{display:inline-block;font-size:12px;background:var(--ac2);color:var(--ac);border-radius:10px;padding:2px 10px;margin-bottom:6px}
mark{background:#ffd54f;color:#000;border-radius:3px}
.mu{color:var(--mu);font-size:14px}.er{color:var(--er)}
.bar{height:10px;border-radius:5px;background:var(--ac2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:.2s}
.sk{height:90px;border-radius:20px;background:linear-gradient(90deg,var(--sf),var(--ac2),var(--sf));background-size:200%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200%}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:#322f37;color:#fff;border-radius:14px;padding:12px 16px;opacity:0;pointer-events:none;transition:.2s;text-align:center}
#toast.on{opacity:1}
.sw{display:flex;border-radius:24px;background:var(--ac2);padding:3px}.sw button{flex:1;min-height:42px;border:0;border-radius:21px;background:none;color:var(--ac);font:inherit}.sw .on{background:var(--ac);color:#fff}
label.r{display:flex;justify-content:space-between;align-items:center;min-height:48px}
</style></head><body>
<main id="m"></main>
<div id="toast"></div>
<nav id="nav"></nav>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
'use strict';
/* ═══ storage: IndexedDB (key-value) ═══ */
const DB=new Promise((ok,no)=>{const q=indexedDB.open('qa-helper',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=no});
const kvGet=async k=>{const d=await DB;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})};
const kvSet=async(k,v)=>{const d=await DB;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})};
const kvDel=async k=>{const d=await DB;return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=r})};

/* ═══ network ═══ */
const SITE='https://sdo-otvety.info',JSON_URL=SITE+'/assets/questions.json';
async function fetchText(url){ // нативный HTTP в Capacitor, иначе fetch
  const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
  if(H){const r=await H.get({url,connectTimeout:20000,readTimeout:60000,responseType:'text'});if(r.status>=400)throw Error('HTTP '+r.status);return typeof r.data==='string'?r.data:JSON.stringify(r.data)}
  const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}
}
async function fetchJsonProgress(url,cb){ // потоковое чтение, если возможно
  if(!(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp)){
    const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);
    const tot=+r.headers.get('content-length')||0;
    if(r.body&&r.body.getReader){const rd=r.body.getReader(),ch=[];let n=0,t0=Date.now();
      for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);n+=value.length;cb(n,tot,n/Math.max(.1,(Date.now()-t0)/1000))}
      return new TextDecoder().decode(await new Blob(ch).arrayBuffer())}
    return r.text()}
  cb(0,0,0);const t=await fetchText(url);cb(t.length,t.length,0);return t;
}

/* ═══ search-index ═══ */
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim();
function validate(arr){
  if(!Array.isArray(arr))throw Error('Ожидался массив объектов [{q,a,c,u}]');
  const seen=new Set(),out=[];let bad=0;
  for(const o of arr){if(!o||typeof o.q!=='string'||typeof o.a!=='string'||!o.q.trim()){bad++;continue}
    const k=o.q+'\u0001'+o.a;if(seen.has(k))continue;seen.add(k);
    out.push({q:o.q.trim(),a:o.a.trim(),c:String(o.c||'Без категории'),u:typeof o.u==='string'?o.u:''})}
  if(!out.length)throw Error('В файле нет корректных записей (нужны поля q и a)');
  return{out,bad};
}
function build(items){
  const m=new Map(),cats={};
  items.forEach((it,i)=>{it.nq=norm(it.q);it.na=norm(it.a);cats[it.c]=(cats[it.c]||0)+1;
    new Set((it.nq+' '+it.na).split(' ')).forEach(t=>{if(!t)return;const a=m.get(t);a?a.push(i):m.set(t,[i])})});
  S.idx={m,keys:[...m.keys()].sort()};S.cats=cats;
}
const lb=(k,t)=>{let l=0,h=k.length;while(l<h){const x=(l+h)>>1;k[x]<t?l=x+1:h=x}return l};
function search(){
  const q=norm(S.q);S.res=[];if(!q||!S.idx)return;
  const ts=q.split(' '),{m,keys}=S.idx;let ids=null;
  for(const t of ts){const set=new Set();for(let i=lb(keys,t);i<keys.length&&keys[i].startsWith(t);i++)for(const id of m.get(keys[i]))set.add(id);
    ids=ids?new Set([...ids].filter(x=>set.has(x))):set;if(!ids.size)break}
  const r=[];
  for(const id of ids){const it=S.items[id];if(S.cat&&it.c!==S.cat)continue;let s=0,pos=-1,ord=true;
    for(const t of ts){let p=it.nq.startsWith(t)?0:it.nq.indexOf(' '+t);
      if(p>=0){s+=10+t.length;if(p===0)s+=5;if(p<pos)ord=false;pos=p}else s+=3}
    if(ord&&ts.length>1)s+=5;if(it.nq.includes(q))s+=20;if(it.nq.startsWith(q))s+=10;r.push([id,s])}
  r.sort((a,b)=>b[1]-a[1]);S.res=r.map(x=>x[0]);
}

/* ═══ state ═══ */
const MODES={site:'Сайт',own:'Своя',site2:'Сайт 2.0',own2:'Своя 2.0'};
const THEMES={auto:'Системная',light:'Светлая',dark:'Тёмная',amoled:'AMOLED (чёрная)',sepia:'Сепия',blue:'Голубая'};
const FONTS={sys:['Системный','system-ui,sans-serif'],serif:['С засечками','Georgia,"Times New Roman",serif'],mono:['Моноширинный','ui-monospace,Menlo,Consolas,monospace'],round:['Округлый','"Trebuchet MS","Segoe UI",sans-serif']};
const S={tab:'s',mode:'site',items:[],idx:null,cats:{},cat:'',q:'',lim:10,res:[],hist:[],pref:{theme:'auto',font:'sys',fs:16,auto:true},meta:{},st:null,pend:null};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vib=()=>navigator.vibrate&&navigator.vibrate(15);
const metaNow=()=>S.meta[S.mode]||{};
const isDev=()=>S.mode.endsWith('2');
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
const I={s:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>',
 g:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};

/* ═══ data ═══ */
async function loadActive(){
  const k={site:'db_site',own:'db_own'}[S.mode];
  S.items=k?(await kvGet(k))||[]:[];S.q='';S.cat='';S.lim=10;build(S.items);search();
}
async function checkUpdate(force){
  S.st={t:'msg',m:'Проверяю сайт…'};render();
  try{
    const html=await fetchText(SITE+'/'),mt=/Материал обновл[её]н\s+(\d{2}\.\d{2}\.\d{4})/.exec(html);
    if(!mt)throw Error('Не удалось найти дату на странице');
    const d=mt[1],cur=S.meta.site;
    if(!force&&cur&&cur.date===d&&(await kvGet('db_site'))){S.st={t:'msg',m:'У вас актуальная база ('+d+')'};render();return}
    S.st={t:'prog',p:0,m:'Загрузка базы…'};render();
    const text=await fetchJsonProgress(JSON_URL,(n,tot,sp)=>{S.st={t:'prog',p:tot?n/tot*100:0,m:'Загрузка: '+(n/1048576).toFixed(1)+(tot?' / '+(tot/1048576).toFixed(1):'')+' МБ'+(sp?', '+(sp/1048576).toFixed(2)+' МБ/с':'')};upBar()});
    S.st={t:'msg',m:'Обработка и индексация…'};render();await new Promise(r=>setTimeout(r,30));
    let arr;try{arr=JSON.parse(text)}catch(e){throw Error('Файл повреждён: это не корректный JSON')}
    const{out}=validate(arr);await kvSet('db_site',out);
    S.meta.site={date:d,count:out.length};await kvSet('meta',S.meta);
    if(S.mode==='site')await loadActive();
    S.st={t:'msg',m:'Готово: '+out.length+' вопросов, дата '+d};vib();
  }catch(e){S.st={t:'err',m:(navigator.onLine?'Ошибка: ':'Нет сети. ')+e.message}}
  render();
}
function upBar(){const b=$('#bar');if(b)b.style.width=S.st.p+'%';const l=$('#bl');if(l)l.textContent=S.st.m+(S.st.p?' ('+Math.round(S.st.p)+'%)':'')}
async function dl(){
  if(!S.items.length)return toast('База пуста');
  const bl=new Blob([JSON.stringify(S.items.map(({q,a,c,u})=>({q,a,c,u})))],{type:'application/json'}),f=new File([bl],'questions_'+S.mode+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=f.name;a.click()}
}

/* ═══ ui ═══ */
function hl(text){
  const ts=norm(S.q).split(' ').filter(Boolean);let h=esc(text);if(!ts.length)return h;
  const re=new RegExp('('+ts.map(t=>t.replace(/е/g,'[её]').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')[а-яёa-z0-9]*','gi');
  return h.replace(re,'<mark>$&</mark>');
}
function ans(a){
  const parts=a.split(/\n|\s\|\s|;\s/).map(x=>x.trim()).filter(Boolean);
  return parts.length>1?'<ul>'+parts.map(p=>'<li>'+hl(p)+'</li>').join('')+'</ul>':hl(a);
}
const cardHtml=id=>{const it=S.items[id];return `<div class="card"><span class="bd">${esc(it.c)}</span><div class="lb">Вопрос</div><div class="q">${hl(it.q)}</div><div class="lb">Ответ</div><div class="a">${ans(it.a)}</div></div>`};
function stat(){const st=S.st;if(!st)return '';
  return st.t==='prog'?`<div class="bar"><i id="bar" style="width:${st.p}%"></i></div><div id="bl" class="mu">${st.m}</div>`:
  `<div class="${st.t==='err'?'er':'mu'}" style="margin:6px 0">${esc(st.m)}</div>${st.t==='err'?'<button class="btn" data-act="retry">Повторить</button>':''}`}
function head(){
  const m=metaNow();
  return `<div class="card" style="padding:12px 14px"><div class="kv"><span>Режим работы:</span><b>${MODES[S.mode]}</b></div>
  <div class="kv"><span>Материал от:</span><b>${isDev()?'—':m.date||'—'}</b></div>
  <div class="kv"><span>Вопросов в БД:</span><b>${S.items.length}</b></div>
  <div class="kv"><span>Раздел:</span><b>${esc(S.cat||'Все')}</b></div></div>`;
}
const histHtml=()=>S.hist.length?S.hist.map(h=>`<button class="chip" data-h="${esc(h)}">${esc(h)}</button>`).join(''):'<span class="mu">История поиска пуста</span>';
function resHtml(){
  if(!norm(S.q))return '<div class="mu" style="text-align:center;margin-top:24px">Введите слова или части слов в любом порядке</div>';
  if(!S.res.length)return '<div class="card" style="text-align:center"><b>Ничего не найдено</b><div class="mu">Проверьте ввод или смените раздел в настройках</div></div>';
  return `<div class="mu" style="margin:4px 4px 8px">Найдено: ${S.res.length}</div>`+S.res.slice(0,S.lim).map(cardHtml).join('')+(S.res.length>S.lim?'<button class="btn s" data-act="more" style="width:100%">Показать ещё</button>':'');
}
function viewSearch(){
  if(S.loading)return '<div class="sk"></div><div class="sk"></div>';
  if(!S.items.length){
    const b=isDev()?'<div class="mu">Режим в разработке</div>':S.mode==='site'?'<div class="mu" style="margin:6px 0 12px">Установите базу с сайта (нужен интернет один раз).</div><button class="btn" data-act="retry">Установить базу</button>':'<div class="mu" style="margin:6px 0 12px">Загрузите свой JSON-файл в настройках.</div><button class="btn" data-tab="g">Открыть настройки</button>';
    return head()+stat()+`<div class="card" style="text-align:center"><b>Базы нет</b>${b}</div>`;
  }
  return head()+stat()+`<div class="card hist" id="hist">${histHtml()}</div>
  <input type="search" id="q" placeholder="Поиск: например «боков ролик 500»" value="${esc(S.q)}" aria-label="Поиск" autocomplete="off">
  <div id="res" style="margin-top:12px">${resHtml()}</div>`;
}
const opts=(o,v)=>Object.entries(o).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${Array.isArray(n)?n[0]:n}</option>`).join('');
function viewSet(){
  const dev=isDev(),m=metaNow(),site=S.mode==='site',cs=Object.entries(S.cats).sort((a,b)=>b[1]-a[1]);
  const today=new Date().toISOString().slice(0,10);
  const p=S.pend?`<div style="margin-top:12px"><div class="mu">Файл проверен: ${S.pend.out.length} записей${S.pend.bad?', пропущено битых: '+S.pend.bad:''}. Укажите дату актуальности материала:</div>
   <input type="date" id="pd" class="in" value="${today}"><div class="row"><button class="btn" data-act="psave">Сохранить</button><button class="btn s" data-act="pcancel">Отмена</button></div></div>`:'';
  return `<div class="card"><b>Режим работы</b><div class="g" style="margin-top:10px">${Object.entries(MODES).map(([k,n])=>`<button class="chip ${S.mode===k?'on':''}" data-mode="${k}">${n}</button>`).join('')}</div></div>
  <div class="card"><b>База данных</b>
  ${dev?'<div class="mu" style="margin-top:8px">Режим в разработке: функции появятся позже.</div>':`<div class="kv" style="margin-top:8px"><span>Материал от</span><b>${m.date||'—'}</b></div><div class="kv"><span>Вопросов в БД</span><b>${S.items.length}</b></div>${stat()}
  <div class="row" style="margin-top:8px">${site?'<button class="btn s" data-act="upd">Проверить актуальность</button>':'<button class="btn s" data-act="load">Выгрузить БД</button>'}<button class="btn s" data-act="exp">Скачать БД</button></div>${p}`}</div>
  <div class="card"><b>Поиск</b>
  <label class="r">Раздел<select id="ct" style="width:60%"><option value="">Все (${S.items.length})</option>${cs.map(([c,n])=>`<option value="${esc(c)}" ${S.cat===c?'selected':''}>${esc(c)} (${n})</option>`).join('')}</select></label>
  <label class="r">Автопроверка при запуске<input type="checkbox" id="au" ${S.pref.auto?'checked':''} style="width:24px;height:24px"></label>
  <button class="btn s" data-act="clh">Очистить историю</button></div>
  <div class="card"><b>Системные</b>
  <label class="r">Тема<select id="th" style="width:60%">${opts(THEMES,S.pref.theme)}</select></label>
  <label class="r">Шрифт<select id="ft" style="width:60%">${opts(FONTS,S.pref.font)}</select></label>
  <label class="r">Размер текста: <span id="fsl">${S.pref.fs} px</span><input type="range" id="fs" min="14" max="26" value="${S.pref.fs}" style="width:50%"></label></div>`;
}
function render(){
  $('#m').innerHTML=S.tab==='s'?viewSearch():viewSet();
  $('#nav').innerHTML=[['s','Поиск'],['g','Настройки']].map(([k,n])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}" aria-label="${n}">${I[k]}${n}</button>`).join('');
}
function applyPref(){const r=document.documentElement;r.dataset.t=S.pref.theme;r.style.setProperty('--fs',S.pref.fs+'px');r.style.setProperty('--ff',(FONTS[S.pref.font]||FONTS.sys)[1])}
const savePref=()=>kvSet('pref',S.pref);
function go(t,push){S.tab=t;if(push!==false)history.pushState({t},'');render()}

/* ═══ events ═══ */
let dt;
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){S.q=e.target.value;S.lim=10;clearTimeout(dt);dt=setTimeout(()=>{search();$('#res').innerHTML=resHtml();
    clearTimeout(S.ht);S.ht=setTimeout(()=>{const n=norm(S.q);if(n.length>2&&S.res.length){S.hist=[n,...S.hist.filter(x=>x!==n)].slice(0,15);kvSet('hist',S.hist);const h=$('#hist');if(h)h.innerHTML=histHtml()}},1500)},30)}
  if(id==='ct'){S.cat=e.target.value;S.lim=10;search();toast('Раздел: '+(S.cat||'Все'))}
  if(id==='th'){S.pref.theme=e.target.value;applyPref();savePref()}
  if(id==='ft'){S.pref.font=e.target.value;applyPref();savePref()}
  if(id==='fs'){S.pref.fs=+e.target.value;$('#fsl').textContent=S.pref.fs+' px';applyPref();savePref()}
  if(id==='au'){S.pref.auto=e.target.checked;savePref()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act],[data-tab],[data-h],[data-mode]');if(!b)return;
  const d=b.dataset;
  if(d.tab)return go(d.tab);
  if(d.h){S.q=d.h;render();search();$('#res').innerHTML=resHtml();return}
  if(d.mode){S.mode=d.mode;S.st=null;S.pend=null;await kvSet('mode',S.mode);await loadActive();vib();return render()}
  switch(d.act){
    case'upd':checkUpdate();break;
    case'retry':checkUpdate(true);break;
    case'more':S.lim+=10;$('#res').innerHTML=resHtml();break;
    case'exp':dl();break;
    case'load':$('#file').click();break;
    case'pcancel':S.pend=null;render();break;
    case'psave':{const v=($('#pd').value||'').split('-'),date=v.length===3?v[2]+'.'+v[1]+'.'+v[0]:'';
      await kvSet('db_own',S.pend.out);S.meta.own={date,count:S.pend.out.length};await kvSet('meta',S.meta);
      S.pend=null;await loadActive();toast('База сохранена');vib();render();break}
    case'clh':S.hist=[];kvSet('hist',[]);toast('История очищена');break;
  }
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{let arr;try{arr=JSON.parse(await f.text())}catch{throw Error('Файл повреждён: это не корректный JSON')}
    S.pend=validate(arr);render()}
  catch(err){toast('Ошибка: '+err.message)}
});
window.addEventListener('popstate',()=>{if(S.tab!=='s')go('s',false)});

/* ═══ старт ═══ */
(async()=>{
  S.loading=true;render();
  try{
    let mt=(await kvGet('meta'))||{};if(mt.date||mt.count)mt={site:mt};S.meta=mt;
    S.hist=(await kvGet('hist'))||[];Object.assign(S.pref,await kvGet('pref')||{});
    S.mode=(await kvGet('mode'))||'site';if(!MODES[S.mode])S.mode='site';applyPref();await loadActive();
  }catch(e){toast('Ошибка хранилища: '+e.message)}
  S.loading=false;render();
  if(S.mode==='site'){if(!S.items.length)checkUpdate(true);else if(S.pref.auto&&navigator.onLine)checkUpdate()}
})();
</script></body></html>
